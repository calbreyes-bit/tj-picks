<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJ Picks</title>
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-2:#EFEAE0;
  --border:#E1D9C9;
  --ink:#211C15;
  --ink-muted:#75695A;
  --ink-faint:#A79A87;
  --accent:#9C6B1F;
  --accent-fill:#EFCE8E;
  --accent-ink:#5B3E10;
  --good:#1F8A4C;
  --good-fill:#DCF1E3;
  --bad:#C23B3B;
  --bad-fill:#FBE3E1;
  --neutral:#8B8478;
  --neutral-fill:#EDE9E1;
  --shadow: 0 1px 2px rgba(33,28,21,.06), 0 8px 24px -12px rgba(33,28,21,.18);
  --font-display:'Oswald',system-ui,sans-serif;
  --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131110;
    --surface:#1D1A16;
    --surface-2:#262119;
    --border:#3A3327;
    --ink:#F1ECE1;
    --ink-muted:#B0A48F;
    --ink-faint:#786C5A;
    --accent:#E8B85B;
    --accent-fill:#4A3A17;
    --accent-ink:#F5D999;
    --good:#4CBE7C;
    --good-fill:#1B3626;
    --bad:#E2645F;
    --bad-fill:#3D2220;
    --neutral:#9A927F;
    --neutral-fill:#2B271E;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131110;
  --surface:#1D1A16;
  --surface-2:#262119;
  --border:#3A3327;
  --ink:#F1ECE1;
  --ink-muted:#B0A48F;
  --ink-faint:#786C5A;
  --accent:#E8B85B;
  --accent-fill:#4A3A17;
  --accent-ink:#F5D999;
  --good:#4CBE7C;
  --good-fill:#1B3626;
  --bad:#E2645F;
  --bad-fill:#3D2220;
  --neutral:#9A927F;
  --neutral-fill:#2B271E;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
}
::selection{background:var(--accent-fill);color:var(--accent-ink);}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px;}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;gap:16px;
  padding:28px 20px 20px;
  max-width:1180px;margin:0 auto;
}
.crest{
  width:52px;height:52px;border-radius:14px;overflow:hidden;
  flex:none;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.crest img{width:100%;height:100%;object-fit:cover;display:block;}
.title-block h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  letter-spacing:.01em;
  margin:0;
  text-wrap:balance;
}
.title-block .sub{
  font-size:12.5px;
  color:var(--ink-muted);
  margin-top:2px;
  font-family:var(--font-mono);
  letter-spacing:.01em;
}
.theme-toggle{
  margin-left:auto;
  width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;flex:none;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink-faint);}

/* ---------- hero stat row ---------- */
.hero{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:8px 0 22px;
}
.hero-tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.hero-tile .label{
  font-family:var(--font-display);
  text-transform:uppercase;
  font-size:11px;letter-spacing:.08em;
  color:var(--ink-muted);
  margin-bottom:6px;
}
.hero-tile .value{
  font-family:var(--font-mono);
  font-size:28px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
.hero-tile .value.good{color:var(--good);}
.hero-tile .value.bad{color:var(--bad);}
.hero-tile .sub{
  font-size:11.5px;color:var(--ink-faint);margin-top:3px;
  font-family:var(--font-mono);
}

/* ---------- filter bar ---------- */
.filter-sticky{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding:12px 0 14px;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}
.filterbar-row{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.filter-label{
  font-family:var(--font-display);text-transform:uppercase;font-size:10.5px;
  letter-spacing:.06em;color:var(--ink-faint);flex:none;
}
.seg{
  display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;
  border:1px solid var(--border);
}
.seg button{
  border:none;background:transparent;color:var(--ink-muted);
  font-family:var(--font-body);font-size:12.5px;font-weight:600;
  padding:6px 12px;border-radius:8px;cursor:pointer;
}
.seg button.active{background:var(--accent);color:var(--accent-ink);}
.seg button:not(.active):hover{color:var(--ink);}

.datefields{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);}
.datefields input{
  font-family:var(--font-mono);font-size:12.5px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:7px;padding:5px 8px;
}

.type-filter{display:flex;gap:6px;flex-wrap:wrap;}
.type-chip{
  border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
  font-family:var(--font-body);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;cursor:pointer;
}
.type-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* ---------- breakdown section ---------- */
.breakdowns{
  display:grid;grid-template-columns:1.1fr 1.4fr;gap:14px;
  margin-bottom:24px;
}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px 18px;box-shadow:var(--shadow);
}
.panel h2{
  font-family:var(--font-display);font-size:13px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-muted);margin:0 0 12px;font-weight:600;
}
.bd-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.bd-row + .bd-row{border-top:1px solid var(--border);}
.bd-name{width:96px;flex:none;font-size:12.5px;font-weight:600;}
.bd-bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
.bd-bar-fill{height:100%;border-radius:5px;background:var(--good);}
.bd-stat{
  width:118px;flex:none;text-align:right;font-family:var(--font-mono);
  font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;
}
.bd-stat b{color:var(--ink);font-weight:600;}

.league-table{width:100%;border-collapse:collapse;}
.league-table th{
  text-align:left;font-family:var(--font-display);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
  font-weight:600;padding:0 0 8px;
}
.league-table th.num,.league-table td.num{text-align:right;}
.league-table td{
  padding:7px 0;border-top:1px solid var(--border);font-size:12.5px;
}
.league-table td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-muted);}
.league-table td.rate{font-weight:700;font-family:var(--font-mono);}
.league-table tr:hover td{background:var(--surface-2);}

/* ---------- chart ---------- */
.chart-panel{margin-bottom:24px;}
.chart-panel .chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.chart-panel .chart-head .cur{font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);}
.chart-svg{width:100%;height:150px;display:block;overflow:visible;}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.chart-area{fill:var(--accent);opacity:.10;}
.chart-zero{stroke:var(--border);stroke-width:1;stroke-dasharray:3 3;}
.chart-dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;}
.chart-hover-line{stroke:var(--ink-faint);stroke-width:1;}
.chart-tip{
  position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);
  font-family:var(--font-mono);font-size:11px;padding:6px 9px;border-radius:8px;
  transform:translate(-50%,-115%);white-space:nowrap;box-shadow:var(--shadow);
  opacity:0;transition:opacity .08s;
}
.chart-wrap{position:relative;}

/* ---------- match list ---------- */
.day-heading{
  font-family:var(--font-display);font-size:12px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-faint);
  margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;
}
.day-heading .cnt{font-family:var(--font-mono);color:var(--ink-faint);}
.match-row{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px;margin-bottom:7px;
}
.match-meta{width:168px;flex:none;}
.match-league{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-display);}
.match-teams{font-size:13px;font-weight:600;margin-top:1px;}
.match-time{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:1px;}
.match-picks{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.pick-chip{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:8px;padding:4px 9px 4px 8px;
  font-size:11.5px;font-weight:600;border:1px solid transparent;
  font-family:var(--font-body);
}
.pick-chip .icon{font-size:11px;line-height:1;}
.pick-chip.hit{background:var(--good-fill);color:var(--good);border-color:color-mix(in srgb, var(--good) 35%, transparent);}
.pick-chip.miss{background:var(--bad-fill);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 35%, transparent);}
.pick-chip.pending{background:var(--neutral-fill);color:var(--ink-muted);border-color:var(--border);}
.pick-chip .slot{opacity:.62;font-weight:500;font-family:var(--font-mono);font-size:10px;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-faint);
  font-family:var(--font-mono);font-size:13px;
}

footer.credit{
  text-align:center;color:var(--ink-faint);font-size:11.5px;
  font-family:var(--font-mono);margin-top:36px;
}

/* ---------- tabs ---------- */
.tabbar{
  display:flex;gap:4px;margin-bottom:20px;
  border-bottom:1px solid var(--border);
}
.tabbtn{
  border:none;background:transparent;color:var(--ink-muted);
  font-family:var(--font-display);font-size:13px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;
  padding:10px 4px;margin-right:22px;cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tabbtn.active{color:var(--ink);border-bottom-color:var(--accent);}
.tabbtn:hover:not(.active){color:var(--ink);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---------- details table ---------- */
.details-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);}
table.details-table{width:100%;border-collapse:collapse;min-width:920px;}
.details-table thead th{
  position:sticky;top:0;background:var(--surface-2);
  text-align:left;font-family:var(--font-display);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);
  font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.details-table td{
  padding:7px 10px;border-bottom:1px solid var(--border);
  font-size:12.5px;vertical-align:middle;white-space:nowrap;
}
.details-table tbody tr:hover td{background:var(--surface-2);}
.details-table td.dt-date{font-family:var(--font-mono);color:var(--ink-muted);font-size:11.5px;}
.details-table td.dt-league{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-display);}
.details-table td.dt-match{font-weight:600;white-space:normal;min-width:170px;}
.details-table td.dt-pick{min-width:118px;}
.dcell{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:7px;padding:3px 8px;font-size:11px;font-weight:600;
  white-space:normal;line-height:1.25;
}
.dcell.hit{background:var(--good-fill);color:var(--good);}
.dcell.miss{background:var(--bad-fill);color:var(--bad);}
.dcell.pending{background:var(--neutral-fill);color:var(--ink-muted);}
.dcell .icon{font-size:10px;}
.dt-empty{color:var(--ink-faint);}
.details-count{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
  margin:10px 2px 0;
}

@media (max-width:720px){
  .hero{grid-template-columns:repeat(2,1fr);}
  .breakdowns{grid-template-columns:1fr;}
  .match-row{flex-wrap:wrap;}
  .match-meta{width:100%;}
}
</style>

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function dstr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseYMD(s){
    var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]);
  }

  var allDates = DATA.map(function(m){ return m.date; }).filter(Boolean).sort();
  var MIN_DATE = allDates[0], MAX_DATE = allDates[allDates.length-1];

  var TYPES = ['BTTS','Moneyline','Over/Under','Spread','Other'];
  var activeTypes = {};
  TYPES.forEach(function(t){ activeTypes[t] = true; });

  var typeFilterEl = document.getElementById('typeFilter');
  typeFilterEl.innerHTML = TYPES.map(function(t){
    return '<button class="type-chip active" data-type="'+esc(t)+'">'+esc(t)+'</button>';
  }).join('');
  typeFilterEl.addEventListener('click', function(e){
    var btn = e.target.closest('.type-chip');
    if (!btn) return;
    var t = btn.getAttribute('data-type');
    var activeCount = TYPES.filter(function(x){return activeTypes[x];}).length;
    if (activeTypes[t] && activeCount === 1) return; // keep at least one
    activeTypes[t] = !activeTypes[t];
    btn.classList.toggle('active', activeTypes[t]);
    refresh();
  });

  var SLOTS_ALL = ['Lean 1','Lean 2','Lean 3','Parlay Piece'];
  var SLOT_SHORT = {'Lean 1':'Lean 1','Lean 2':'Lean 2','Lean 3':'Lean 3','Parlay Piece':'Parlay'};
  var activeSlots = {};
  SLOTS_ALL.forEach(function(s){ activeSlots[s] = true; });

  var slotFilterEl = document.getElementById('slotFilter');
  slotFilterEl.innerHTML = SLOTS_ALL.map(function(s){
    return '<button class="type-chip active" data-slot="'+esc(s)+'">'+esc(SLOT_SHORT[s])+'</button>';
  }).join('');
  slotFilterEl.addEventListener('click', function(e){
    var btn = e.target.closest('.type-chip');
    if (!btn) return;
    var s = btn.getAttribute('data-slot');
    var activeCount = SLOTS_ALL.filter(function(x){return activeSlots[x];}).length;
    if (activeSlots[s] && activeCount === 1) return; // keep at least one
    activeSlots[s] = !activeSlots[s];
    btn.classList.toggle('active', activeSlots[s]);
    refresh();
  });

  var fromInput = document.getElementById('fromDate');
  var toInput = document.getElementById('toDate');
  var presetSeg = document.getElementById('presetSeg');

  function setPresetRange(preset){
    var to = parseYMD(MAX_DATE);
    var from;
    if (preset === '7d'){ from = new Date(to); from.setDate(from.getDate()-6); }
    else if (preset === '30d'){ from = new Date(to); from.setDate(from.getDate()-29); }
    else if (preset === 'month'){ from = new Date(to.getFullYear(), to.getMonth(), 1); }
    else { from = parseYMD(MIN_DATE); }
    if (from < parseYMD(MIN_DATE)) from = parseYMD(MIN_DATE);
    fromInput.value = dstr(from);
    toInput.value = dstr(to);
  }
  setPresetRange('30d');

  presetSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-preset]');
    if (!btn) return;
    Array.prototype.forEach.call(presetSeg.querySelectorAll('button'), function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    setPresetRange(btn.getAttribute('data-preset'));
    refresh();
  });
  [fromInput, toInput].forEach(function(inp){
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(presetSeg.querySelectorAll('button'), function(b){ b.classList.remove('active'); });
      refresh();
    });
  });

  function currentFiltered(){
    var from = fromInput.value, to = toInput.value;
    return DATA.filter(function(m){
      return m.date && m.date >= from && m.date <= to;
    }).map(function(m){
      var picks = m.picks.filter(function(p){ return activeTypes[p.type] && activeSlots[p.slot]; });
      return picks.length ? Object.assign({}, m, {picks: picks}) : null;
    }).filter(Boolean);
  }

  function fmtPct(n){ return (n*100).toFixed(1)+'%'; }

  function computeStats(matches){
    var hit=0, miss=0, pending=0;
    var byType = {}; TYPES.forEach(function(t){ byType[t] = {hit:0,miss:0}; });
    var byLeague = {};
    matches.forEach(function(m){
      m.picks.forEach(function(p){
        if (p.status === 'hit') hit++;
        else if (p.status === 'miss') miss++;
        else pending++;
        if (p.status === 'hit' || p.status === 'miss'){
          byType[p.type][p.status]++;
          var lg = m.league || 'Unknown';
          byLeague[lg] = byLeague[lg] || {hit:0,miss:0};
          byLeague[lg][p.status]++;
        }
      });
    });
    return {hit:hit, miss:miss, pending:pending, byType:byType, byLeague:byLeague};
  }

  function renderHero(stats){
    var graded = stats.hit + stats.miss;
    var rate = graded ? stats.hit/graded : 0;
    var el = document.getElementById('heroTiles');
    el.innerHTML =
      '<div class="hero-tile"><div class="label">Record</div><div class="value">'+stats.hit+'&ndash;'+stats.miss+'</div><div class="sub">W&ndash;L, graded picks</div></div>'+
      '<div class="hero-tile"><div class="label">Hit Rate</div><div class="value '+(graded ? (rate>=0.5?'good':'bad') : '')+'">'+(graded ? fmtPct(rate) : '&ndash;')+'</div><div class="sub">'+graded+' graded</div></div>'+
      '<div class="hero-tile"><div class="label">Picks Tracked</div><div class="value">'+(stats.hit+stats.miss+stats.pending)+'</div><div class="sub">in selected range</div></div>'+
      '<div class="hero-tile"><div class="label">Pending</div><div class="value">'+stats.pending+'</div><div class="sub">not yet graded</div></div>';
  }

  function renderTypeBreakdown(stats){
    var el = document.getElementById('typeBreakdown');
    var rows = TYPES.map(function(t){
      var d = stats.byType[t];
      var g = d.hit + d.miss;
      var rate = g ? d.hit/g : null;
      return {t:t, g:g, rate:rate, hit:d.hit, miss:d.miss};
    }).filter(function(r){ return r.g > 0; }).sort(function(a,b){ return b.g - a.g; });
    if (!rows.length){ el.innerHTML = '<div class="empty-state" style="padding:20px 0;">No graded picks in range</div>'; return; }
    el.innerHTML = rows.map(function(r){
      var pct = r.rate*100;
      var color = r.rate >= 0.5 ? 'var(--good)' : 'var(--bad)';
      return '<div class="bd-row">'+
        '<div class="bd-name">'+esc(r.t)+'</div>'+
        '<div class="bd-bar-track"><div class="bd-bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+color+';"></div></div>'+
        '<div class="bd-stat"><b>'+fmtPct(r.rate)+'</b> &middot; '+r.hit+'&ndash;'+r.miss+'</div>'+
      '</div>';
    }).join('');
  }

  function renderLeagueBreakdown(stats){
    var el = document.getElementById('leagueBreakdown');
    var rows = Object.keys(stats.byLeague).map(function(lg){
      var d = stats.byLeague[lg];
      var g = d.hit + d.miss;
      return {lg:lg, g:g, hit:d.hit, miss:d.miss, rate: g ? d.hit/g : 0};
    }).filter(function(r){ return r.g >= 5; }).sort(function(a,b){ return b.rate - a.rate; });
    if (!rows.length){ el.innerHTML = '<tr><td colspan="4" style="color:var(--ink-faint);padding:14px 0;">No league has 5+ graded picks in range</td></tr>'; return; }
    el.innerHTML = rows.map(function(r){
      var color = r.rate >= 0.5 ? 'var(--good)' : 'var(--bad)';
      return '<tr><td>'+esc(r.lg)+'</td><td class="num">'+r.hit+'&ndash;'+r.miss+'</td><td class="num">'+r.g+'</td><td class="num rate" style="color:'+color+';">'+fmtPct(r.rate)+'</td></tr>';
    }).join('');
  }

  function renderChart(matches){
    var svg = document.getElementById('chartSvg');
    var tip = document.getElementById('chartTip');
    var byDay = {};
    matches.forEach(function(m){
      m.picks.forEach(function(p){
        if (p.status !== 'hit' && p.status !== 'miss') return;
        byDay[m.date] = byDay[m.date] || {hit:0,miss:0};
        byDay[m.date][p.status]++;
      });
    });
    var days = Object.keys(byDay).sort();
    if (!days.length){
      svg.innerHTML = '';
      document.getElementById('chartCur').textContent = '';
      return;
    }
    var cum = 0, pts = [];
    days.forEach(function(d){
      cum += byDay[d].hit - byDay[d].miss;
      pts.push({date:d, cum:cum, hit:byDay[d].hit, miss:byDay[d].miss});
    });
    var W = 1000, H = 150, padL = 8, padR = 8, padT = 14, padB = 14;
    var vals = pts.map(function(p){return p.cum;});
    var min = Math.min(0, Math.min.apply(null, vals));
    var max = Math.max(0, Math.max.apply(null, vals));
    if (min === max){ min -= 1; max += 1; }
    function X(i){ return pts.length===1 ? W/2 : padL + (i/(pts.length-1))*(W-padL-padR); }
    function Y(v){ return H - padB - ((v-min)/(max-min))*(H-padT-padB); }
    var zeroY = Y(0);
    var line = pts.map(function(p,i){ return (i===0?'M':'L')+X(i).toFixed(1)+','+Y(p.cum).toFixed(1); }).join(' ');
    var area = line + ' L'+X(pts.length-1).toFixed(1)+','+zeroY.toFixed(1)+' L'+X(0).toFixed(1)+','+zeroY.toFixed(1)+' Z';
    var last = pts[pts.length-1];
    document.getElementById('chartCur').textContent = (last.cum>=0?'+':'')+last.cum+' net';

    var dots = pts.map(function(p,i){
      return '<circle class="chart-dot" data-i="'+i+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.cum).toFixed(1)+'" r="7" fill="transparent" stroke="none"></circle>';
    }).join('');

    svg.innerHTML =
      '<line class="chart-zero" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+zeroY.toFixed(1)+'" y2="'+zeroY.toFixed(1)+'"></line>'+
      '<path class="chart-area" d="'+area+'"></path>'+
      '<path class="chart-line" d="'+line+'"></path>'+
      '<circle class="chart-dot" cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(last.cum).toFixed(1)+'" r="3.5"></circle>'+
      '<line class="chart-hover-line" id="hoverLine" x1="0" x2="0" y1="0" y2="'+H+'" opacity="0"></line>'+
      dots;

    var hoverLine = document.getElementById('hoverLine');
    Array.prototype.forEach.call(svg.querySelectorAll('circle[data-i]'), function(c){
      c.addEventListener('mousemove', function(ev){
        var i = +c.getAttribute('data-i');
        var p = pts[i];
        hoverLine.setAttribute('x1', X(i)); hoverLine.setAttribute('x2', X(i)); hoverLine.setAttribute('opacity','1');
        var rect = svg.getBoundingClientRect();
        var scaleX = rect.width / W;
        tip.style.left = (X(i)*scaleX) + 'px';
        tip.style.top = '0px';
        tip.style.opacity = '1';
        tip.textContent = p.date+'  '+(p.cum>=0?'+':'')+p.cum+'  ('+p.hit+'-'+p.miss+' that day)';
      });
      c.addEventListener('mouseleave', function(){
        hoverLine.setAttribute('opacity','0');
        tip.style.opacity = '0';
      });
    });
  }

  var SLOTS = ['Lean 1','Lean 2','Lean 3','Parlay Piece'];
  function dcell(p){
    if (!p) return '<span class="dt-empty">&ndash;</span>';
    var icon = p.status==='hit' ? '✓' : p.status==='miss' ? '✕' : '•';
    var label = p.status==='hit' ? 'HIT' : p.status==='miss' ? 'MISS' : 'PEND';
    return '<span class="dcell '+p.status+'"><span class="icon">'+icon+'</span>'+esc(p.text)+' &middot; '+label+'</span>';
  }

  function renderDetailsTable(matches){
    var body = document.getElementById('detailsBody');
    var countEl = document.getElementById('detailsCount');
    if (!matches.length){
      body.innerHTML = '<tr><td colspan="7"><div class="empty-state">No picks in this range.</div></td></tr>';
      countEl.textContent = '';
      return;
    }
    var sorted = matches.slice().sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (a.time||'') < (b.time||'') ? 1 : -1;
    });
    var html = sorted.map(function(m){
      var bySlot = {};
      m.picks.forEach(function(p){ bySlot[p.slot] = p; });
      var cells = SLOTS.map(function(s){ return '<td class="dt-pick">'+dcell(bySlot[s])+'</td>'; }).join('');
      return '<tr>'+
        '<td class="dt-date">'+esc(m.date)+(m.time?' '+esc(m.time):'')+'</td>'+
        '<td class="dt-league">'+esc(m.league||'')+'</td>'+
        '<td class="dt-match">'+esc(m.home||'')+' vs '+esc(m.away||'')+'</td>'+
        cells+
      '</tr>';
    }).join('');
    body.innerHTML = html;
    var gradedCount = matches.reduce(function(a,m){ return a + m.picks.filter(function(p){return p.status!=='pending';}).length; }, 0);
    countEl.textContent = sorted.length+' match'+(sorted.length===1?'':'es')+' · '+gradedCount+' graded pick'+(gradedCount===1?'':'s')+' shown';
  }

  var tabbar = document.getElementById('tabbar');
  tabbar.addEventListener('click', function(e){
    var btn = e.target.closest('.tabbtn');
    if (!btn) return;
    var tab = btn.getAttribute('data-tab');
    Array.prototype.forEach.call(tabbar.querySelectorAll('.tabbtn'), function(b){ b.classList.toggle('active', b===btn); });
    Array.prototype.forEach.call(document.querySelectorAll('.tabpanel'), function(p){
      p.classList.toggle('active', p.id === 'tab-'+tab);
    });
  });

  function refresh(){
    var filtered = currentFiltered();
    var stats = computeStats(filtered);
    renderHero(stats);
    renderTypeBreakdown(stats);
    renderLeagueBreakdown(stats);
    renderChart(filtered);
    renderDetailsTable(filtered);
    document.getElementById('rangeLabel').textContent = 'tracked by Carlos · '+fromInput.value+' to '+toInput.value;
  }

  refresh();
})();
</script>

</html>
